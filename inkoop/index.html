<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunst Aanbieden | Koopmans Fine Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f4ee;
            color: #2b2b2b;
            line-height: 1.6;
        }

        /* Top Bar & Header */
        header {
            text-align: center;
            padding: 30px 20px 20px;
            background-color: #f7f4ee;
            position: relative;
        }
        .lang-select {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .lang-select a { color: #1b2834; text-decoration: none; margin-left: 5px; }
        
        .logo-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            letter-spacing: 4px;
            color: #9e824c;
            text-transform: uppercase;
            font-weight: 500;
            line-height: 1;
        }
        .logo-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 6px;
            color: #9e824c;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Navigatiebalk */
        nav {
            background-color: #1b2834;
            text-align: center;
            padding: 14px 0;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
            transition: opacity 0.2s;
        }
        nav a:hover, nav a.active {
            opacity: 0.7;
            border-bottom: 1px solid #ffffff;
            padding-bottom: 2px;
        }

        /* Content Area */
        .main-container {
            max-width: 680px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .page-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            text-align: center;
            color: #1b2834;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .title-divider {
            width: 80px;
            height: 1px;
            background-color: #9e824c;
            margin: 0 auto 20px;
        }
        .page-intro {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 35px;
        }

        /* Form Card */
        .form-card {
            background: #ffffff;
            border: 1px solid #dcd5c7;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1b2834;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="email"], input[type="tel"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dcd5c7;
            background-color: #faf9f6;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: #333;
            border-radius: 0;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #9e824c;
            background-color: #fff;
        }
        textarea { height: 100px; resize: vertical; }

        /* Knop */
        .submit-btn {
            background-color: #1b2834;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #9e824c;
        }

        #status {
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="lang-select">
        <a href="/">NL</a> | <a href="/en/">GB</a>
    </div>
    <div class="logo-title">Koopmans</div>
    <div class="logo-subtitle">Fine Art</div>
</header>

<nav>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/verzameling/">Verzameling</a></li>
        <li><a href="/veilingen/">Veilingen</a></li>
        <li><a href="/historie/">Historie</a></li>
        <li><a href="/inkoop/" class="active">Kunst Aanbieden</a></li>
        <li><a href="/contact/">Contact</a></li>
    </ul>
</nav>

<div class="main-container">
    <h1 class="page-title">Kunstwerk Aanbieden</h1>
    <div class="title-divider"></div>
    <p class="page-intro">Upload foto's en details van uw schilderij. U ontvangt geheel vrijblijvend een beoordeling en inkoopvoorstel.</p>

    <div class="form-card">
        <form id="artForm">
            <div class="form-group">
                <label>Foto's (Voorkant, Achterkant, Signatuur)*</label>
                <input type="file" name="photos" multiple accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Vraagprijs / Richtprijs (€)</label>
                <input type="text" name="asking_price" placeholder="bijv. 450 of 'Bieden'">
            </div>

            <div class="form-group">
                <label>Afmetingen (h x b in cm)</label>
                <input type="text" name="dimensions" placeholder="bijv. 50 x 40 cm">
            </div>

            <div class="form-group">
                <label>Aanvullende informatie / Herkomst</label>
                <textarea name="notes" placeholder="Bijzonderheden over de schilder, herkomst of conditie..."></textarea>
            </div>

            <div class="form-group">
                <label>Uw Naam*</label>
                <input type="text" name="sender_name" required>
            </div>

            <div class="form-group">
                <label>Uw E-mailadres*</label>
                <input type="email" name="sender_email" required>
            </div>

            <div class="form-group">
                <label>Telefoonnummer</label>
                <input type="tel" name="sender_phone">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Aanvraag Versturen</button>
            <div id="status"></div>
        </form>
    </div>
</div>

<script>
document.getElementById('artForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    btn.innerText = 'BEZIG MET VERSTUREN...';
    btn.disabled = true;

    const formData = new FormData(this);

    try {
        const response = await fetch('https://hook.eu1.make.com/9v6e3nnt9aqukc91wb3kttpvscqguk4j', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            document.getElementById('status').innerHTML = '<span style="color:green;">Hartelijk dank. Uw aanvraag is goed ontvangen.</span>';
            this.reset();
        } else {
            throw new Error('Fout bij versturen');
        }
    } catch (err) {
        document.getElementById('status').innerHTML = '<span style="color:red;">Er ging iets mis. Probeer het opnieuw.</span>';
    } finally {
        btn.innerText = 'AANVRAAG VERSTUREN';
        btn.disabled = false;
    }
});
</script>

</body>
</html>
