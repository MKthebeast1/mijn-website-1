<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunst Aanbieden - Koopmans Fine Art</title>
    <link rel="icon" type="image/png" href="/Koopmansfine.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --goud: #b08d57; 
            --blauw: #1f2a35; 
            --donker: #242424; 
            --creme: #f4f1ea; 
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Libre Baskerville', serif; 
            margin: 0; 
            background-color: var(--creme); 
            color: var(--donker); 
            text-align: center; 
            border-top: 10px solid var(--blauw); 
        }
        
        /* 1. Header Styling */
        header { 
            padding: 0.5rem 1rem 0.2rem; 
            position: relative; 
        }
        
        /* 2. Logo Styling */
        header img { 
            max-height: 160px; 
            max-width: 95%; 
            display: block; 
            margin: 0 auto; 
            object-fit: contain; 
            will-change: opacity; 
            transition: opacity 0.05s linear; 
        }
        
        /* 3. Menubalk */
        nav { 
            padding: 0.9rem 0; 
            margin-bottom: 2.5rem; 
            background-color: var(--blauw); 
            overflow-x: auto; 
            white-space: nowrap;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
            -webkit-overflow-scrolling: touch; 
            line-height: 1 !important;
        }

        nav::-webkit-scrollbar { display: none; }

        nav ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            gap: 40px; 
            line-height: 1 !important;
        }

        nav a { 
            text-decoration: none; 
            color: #dcd0c0; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-size: 0.95rem; 
            transition: color 0.3s; 
            display: inline-block;
            line-height: 1 !important;
        }

        nav a:hover, nav a.active { color: #ffffff; }
        
        /* Content Styling */
        .main-content { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 0 2rem 5rem; 
            text-align: left; 
            line-height: 1.8; 
        }

        h2 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.2rem; 
            color: var(--blauw); 
            border-bottom: 3px solid var(--blauw); 
            display: inline-block; 
            padding-bottom: 5px; 
            margin-top: 0.5rem;
            margin-bottom: 1.5rem; 
        }

        .page-intro {
            font-size: 1rem;
            color: #444;
            margin-bottom: 2rem;
        }
        
        /* FORM CARD STYLING */
        .form-card { 
            margin: 2rem auto; 
            max-width: 650px; 
            padding: 35px; 
            border: 4px solid var(--blauw); 
            outline: 1px solid var(--goud); 
            outline-offset: -3px; 
            background-color: #fcfbf8; 
            box-shadow: 10px 10px 20px rgba(0,0,0,0.08); 
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            display: block;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--blauw);
            margin-bottom: 8px;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="tel"], 
        textarea, 
        input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.9rem;
            color: var(--donker);
            border-radius: 2px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="file"] {
            background-color: transparent;
            padding: 8px 0;
            border: none;
        }

        input:focus, textarea:focus {
            border-color: var(--goud);
        }

        textarea { 
            height: 110px; 
            resize: vertical; 
        }

        /* CSS voor het voorwaarden-vinkje */
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .checkbox-container input[type="checkbox"] {
            margin-top: 5px; 
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .checkbox-container label {
            font-size: 0.85rem;
            font-weight: 400; /* Overschrijft de dikgedrukte tekst van gewone labels */
            text-transform: none; /* Overschrijft de hoofdletters van gewone labels */
            letter-spacing: normal;
            line-height: 1.5;
            cursor: pointer;
            color: var(--donker);
            margin-bottom: 0;
            display: inline;
        }

        .checkbox-container a {
            color: var(--blauw);
            font-weight: bold;
            text-decoration: underline;
        }

        .checkbox-container a:hover {
            color: var(--goud);
        }

        .submit-btn { 
            display: block; 
            width: 100%;
            padding: 14px 30px; 
            background-color: var(--blauw); 
            color: #dcd0c0; 
            border: none;
            font-family: 'Libre Baskerville', serif;
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            font-size: 0.85rem; 
            border-radius: 2px; 
            cursor: pointer;
            transition: 0.3s; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            margin-top: 10px;
        }

        .submit-btn:hover { 
            background-color: var(--goud); 
            color: var(--blauw); 
        }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 700;
        }
        
        /* Mobiele styling */
        @media (max-width: 600px) { 
            nav ul { 
                justify-content: flex-start; 
                padding: 0 25px; 
                gap: 30px; 
            } 
            header { padding: 1rem 1rem 0.2rem; }
            header img { max-height: 120px; max-width: 95%; } 

            .form-card {
                padding: 20px 15px;
            }
        }
        
        footer { 
            text-align: center; 
            padding: 4rem 1rem; 
            background-color: var(--donker); 
            color: #888888; 
            font-size: 0.85rem; 
        }

        footer a { color: #888888; text-decoration: none; }
        footer a:hover { color: #bbbbbb; }
    </style>
</head>
<body>

<header>
    <img src="/foto/Adobe Express - file.png" alt="Koopmans Fine Art" id="header-logo">
</header>

<nav>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/verzameling/">Verzameling</a></li>
        <li><a href="/veilingen/">Veilingen</a></li>
        <li><a href="/historie/">Historie</a></li>
        <li><a href="/inkoop/" class="active">Kunst aanbieden</a></li>
        <li><a href="/contact/">Contact</a></li>
    </ul>
</nav>

<div class="main-content">
    <h2>Kunstwerk Aanbieden</h2>
    <p class="page-intro">Upload foto's en details van uw schilderij. U ontvangt geheel vrijblijvend een beoordeling en inkoopvoorstel.</p>
    
    <div class="form-card">
        <form id="artForm">
            <div class="form-group">
                <label>Foto's (Voorkant, Achterkant, Signatuur)*</label>
                <input type="file" name="photos" multiple accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Vraagprijs / Richtprijs (€)</label>
                <input type="text" name="asking_price" placeholder="bijv. 450 of 'Bieden'">
            </div>

            <div class="form-group">
                <label>Afmetingen (h x b in cm)</label>
                <input type="text" name="dimensions" placeholder="bijv. 50 x 40 cm">
            </div>

            <div class="form-group">
                <label>Aanvullende informatie / Herkomst</label>
                <textarea name="notes" placeholder="Bijzonderheden over de schilder, herkomst of conditie..."></textarea>
            </div>

            <div class="form-group">
                <label>Uw Naam*</label>
                <input type="text" name="sender_name" required>
            </div>

            <div class="form-group">
                <label>Uw E-mailadres*</label>
                <input type="email" name="sender_email" required>
            </div>

            <div class="form-group">
                <label>Telefoonnummer</label>
                <input type="tel" name="sender_phone">
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="akkoord_voorwaarden" name="akkoord_voorwaarden" required>
                <label for="akkoord_voorwaarden">
                    Ik ga akkoord met de <a href="/disclaimer/" target="_blank">Voorwaarden voor Particuliere Overname</a> en verklaar bevoegd te zijn dit werk te goeder trouw aan te bieden.
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Aanvraag Versturen</button>
            <div id="status"></div>
        </form>
    </div>
</div>

<footer>
    &copy; 2026 Koopmans Fine Art | M. Koopmans | 
    <a href="/disclaimer/">Disclaimer</a>
</footer>

<!-- Logo scroll effect + automatische centrering van het actieve menu-item op mobiel -->
<script>
    window.addEventListener('scroll', function() {
        var logo = document.getElementById('header-logo');
        var scrollPosition = window.scrollY;
        var maxScroll = 180; 
        var opacity = 1 - (scrollPosition / maxScroll);
        if (opacity < 0) opacity = 0;
        if (opacity > 1) opacity = 1;
        if (logo) logo.style.opacity = opacity;
    }, { passive: true });

    document.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
            var activeLink = document.querySelector('nav a.active');
            var nav = document.querySelector('nav');
            if (activeLink && nav) {
                var navRect = nav.getBoundingClientRect();
                var linkRect = activeLink.getBoundingClientRect();
                nav.scrollLeft = nav.scrollLeft + (linkRect.left - navRect.left) - (navRect.width / 2) + (linkRect.width / 2);
            }
        }, 50);
    });

    /* Formulier afhandeling naar Make.com */
    document.getElementById('artForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'BEZIG MET VERSTUREN...';
        btn.disabled = true;

        const formData = new FormData(this);

        try {
            const response = await fetch('https://hook.eu1.make.com/9v6e3nnt9aqukc91wb3kttpvscqguk4j', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                document.getElementById('status').innerHTML = '<span style="color:#2e7d32;">Hartelijk dank. Uw aanvraag is goed ontvangen.</span>';
                this.reset();
            } else {
                throw new Error('Fout bij versturen');
            }
        } catch (err) {
            document.getElementById('status').innerHTML = '<span style="color:#c62828;">Er ging iets mis. Probeer het opnieuw.</span>';
        } finally {
            btn.innerText = 'AANVRAAG VERSTUREN';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
