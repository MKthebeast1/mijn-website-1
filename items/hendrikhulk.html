<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H. Hulk - MK Fine Art</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --goud: #b08d57; --hout: #3d2b1f; --donker: #242424; --creme: #f4f1ea; }
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: var(--creme); color: var(--donker); line-height: 1.8; border-top: 10px solid var(--hout); }
        .container { max-width: 1100px; margin: 0 auto; padding: 4rem 2rem; }
        .back-nav { margin-bottom: 3rem; text-align: left; }
        .back-link { text-decoration: none; color: var(--hout); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; border-bottom: 2px solid var(--hout); transition: 0.3s; }
        .back-link:hover { color: var(--goud); border-color: var(--goud); }
        .item-layout { display: flex; gap: 60px; align-items: flex-start; margin-top: 2rem; }
        .image-side { flex: 1.3; }
        .text-side { flex: 1; text-align: left; }
        .frame { padding: 15px; border: 18px solid var(--hout); outline: 1px solid var(--goud); outline-offset: -10px; box-shadow: 20px 20px 40px rgba(0,0,0,0.3); background-color: white; }
        .frame img { width: 100%; display: block; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; margin: 0 0 1.5rem 0; text-transform: uppercase; letter-spacing: 2px; }
        .info-list { list-style: none; padding: 0; margin: 0; border-top: 2px solid var(--hout); padding-top: 2rem; }
        .info-list li { margin-bottom: 15px; font-weight: 700; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
        .info-list span { font-weight: 400; color: #555; text-transform: none; margin-left: 8px; }
        .price { margin-top: 2.5rem; font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--hout); font-weight: 700; font-style: italic; }
        @media (max-width: 900px) { .item-layout { flex-direction: column; } .image-side, .text-side { flex: none; width: 100%; } }
        footer { text-align: center; padding: 4rem 1rem; background-color: var(--donker); color: #888; font-size: 0.8rem; margin-top: 5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="../index.html#verzameling" class="back-link">← Terug naar verzameling</a></div>
        <div class="item-layout">
            <div class="image-side"><div class="frame"><img src="../foto/HendrikHulk.jpg" alt="H. Hulk"></div></div>
            <div class="text-side">
                <h1>Hendrik Hulk</h1>
                <ul class="info-list">
                    <li>Techniek: <span>Olieverf op doek</span></li>
                    <li>Jaar: <span>1894</span></li>
                    <li>Status: <span>Beschikbaar</span></li>
                </ul>
                <p class="price">Prijs op aanvraag</p>
                <p style="margin-top: 2rem;">Riviergezicht uit 1894. Een klassiek stuk vakmanschap, toegeschreven aan Hendrik Hulk.</p>
            </div>
        </div>
    </div>
    <footer>&copy; 2026 MK Fine Art | Merijn Koopmans</footer>
</body>
</html>
