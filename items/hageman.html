<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hageman - MK Fine Art</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --goud: #b08d57; --hout: #3d2b1f; --donker: #242424; --creme: #f4f1ea; }
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: var(--creme); color: var(--donker); line-height: 1.8; border-top: 10px solid var(--hout); }
        .container { max-width: 1000px; margin: 0 auto; padding: 3rem 2rem; }
        .back-nav { margin-bottom: 3rem; text-align: left; }
        .back-link { text-decoration: none; color: var(--hout); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; border-bottom: 2px solid var(--hout); }
        
        .item-layout { display: flex; gap: 40px; align-items: flex-start; text-align: left; margin-top: 2rem; }
        .image-side { flex: 1.2; }
        .text-side { flex: 1; padding-top: 20px; }

        .frame { padding: 15px; border: 15px solid var(--hout); outline: 1px solid var(--goud); outline-offset: -8px; box-shadow: 15px 15px 30px rgba(0,0,0,0.2); background-color: white; }
        .frame img { width: 100%; display: block; }

        h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin: 0 0 1rem 0; text-transform: uppercase; }
        .info-list { list-style: none; padding: 0; margin: 0; border-top: 2px solid var(--hout); padding-top: 1.5rem; }
        .info-list li { margin-bottom: 12px; font-weight: 700; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
        .info-list span { font-weight: 400; color: #555; text-transform: none; margin-left: 5px; }
        .price { margin-top: 2rem; font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--hout); font-style: italic; font-weight: 700; }

        @media (max-width: 800px) { .item-layout { flex-direction: column; } }
        footer { text-align: center; padding: 3rem 1rem; background-color: var(--donker); color: #888; font-size: 0.8rem; margin-top: 5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="../index.html" class="back-link">← Terug naar de verzameling</a></div>
        
        <div class="item-layout">
            <div class="image-side">
                <div class="frame"><img src="../foto/Hageman.jpg" alt="Hageman"></div>
            </div>
            <div class="text-side">
                <h1>Hageman</h1>
                <ul class="info-list">
                    <li>Techniek: <span>Olieverf op paneel</span></li>
                    <li>Jaar: <span>ca. 1900</span></li>
                    <li>Status: <span>Beschikbaar</span></li>
                </ul>
                <p class="price">Prijs op aanvraag</p>
                <p style="margin-top: 2rem; font-size: 0.95rem;">Dit werk toont een karakteristiek boerderijtafereel met pluimvee, typerend voor de Larense School.</p>
            </div>
        </div>
    </div>
    <footer>&copy; 2026 MK Fine Art | Merijn Koopmans</footer>
</body>
</html>
