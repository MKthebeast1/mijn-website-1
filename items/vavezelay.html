<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Vezelay - MK Fine Art</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --goud: #b08d57; --hout: #3d2b1f; --donker: #242424; --creme: #f4f1ea; }
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: var(--creme); color: var(--donker); line-height: 1.8; border-top: 10px solid var(--hout); }
        .container { max-width: 900px; margin: 0 auto; padding: 3rem 2rem; }
        .back-nav { margin-bottom: 2rem; text-align: left; }
        .back-link { text-decoration: none; color: var(--hout); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; border-bottom: 2px solid var(--hout); }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; margin-bottom: 0.5rem; text-transform: uppercase; text-align: left; }
        .main-image-wrap { margin: 2rem 0; padding: 20px; border: 20px solid var(--hout); outline: 1px solid var(--goud); outline-offset: -10px; box-shadow: 20px 20px 40px rgba(0,0,0,0.3); background-color: white; }
        .main-image-wrap img { width: 100%; display: block; }
        .specs { background-color: #e9e4d9; padding: 25px; border-left: 5px solid var(--goud); margin: 2rem 0; text-align: left; }
        .specs ul { list-style: none; padding: 0; margin: 0; }
        .specs li { margin-bottom: 10px; font-weight: 700; text-transform: uppercase; font-size: 0.9rem; }
        .specs span { font-weight: 400; color: #555; text-transform: none; margin-left: 10px; }
        footer { text-align: center; padding: 3rem 1rem; background-color: var(--donker); color: #888; font-size: 0.8rem; margin-top: 4rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="../index.html" class="back-link">← Terug naar de verzameling</a></div>
        <h1>Basilique Vezelay</h1>
        <p style="font-style: italic; color: #777; text-align: left;">VA, Hollandse meester (Ca. 1940)</p>
        <div class="main-image-wrap"><img src="../foto/va.jpg" alt="VA Vezelay"></div>
        <div class="specs">
            <ul>
                <li>Techniek: <span>Olieverf op paneel</span></li>
                <li>Periode: <span>Midden 20e eeuw</span></li>
                <li>Status: <span>Beschikbaar</span></li>
            </ul>
        </div>
    </div>
    <footer>&copy; 2026 MK Fine Art | Merijn Koopmans</footer>
</body>
</html>
