<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Collection - Koopmans Fine Art</title>
    <link rel="icon" type="image/png" href="/Koopmansfine.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --goud: #b08d57; --blauw: #1f2a35; --donker: #242424; --creme: #f4f1ea; --papier: #e9e4d9; }
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: var(--creme); color: var(--donker); text-align: center; border-top: 10px solid var(--blauw); }
        
        /* 1. DUNNE HEADER PADDING (Zorgt dat het witte vlak niet te dik wordt) */
        header { padding: 0.5rem 1rem 0.2rem; position: relative; }
        
        /* 2. GROOT LOGO (De perfecte grootte van de homepagina) */
        header img { 
            max-height: 160px; 
            max-width: 95%; 
            display: block; 
            margin: 0 auto; 
            object-fit: contain; 
            will-change: opacity; 
            transition: opacity 0.05s linear; 
        }
        
        /* DUAL TAALSWITCHER RECHTSBOVEN STYLING */
        .lang-switch {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 12px;
        }
        .lang-switch a {
            text-decoration: none;
            font-size: 1.3rem;
            transition: 0.2s;
            display: inline-block;
            line-height: 1;
        }
        .lang-switch a:hover { transform: scale(1.15); }
        
        /* 3. NORMALE, STRAKKE MENUBALK */
        nav { 
            padding: 0.9rem 0; 
            margin-bottom: 2.5rem; 
            background-color: var(--blauw); 
            overflow-x: auto; 
            white-space: nowrap;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
            -webkit-overflow-scrolling: touch; 
            line-height: 1 !important;
        }
        nav::-webkit-scrollbar { display: none; }
        nav ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            gap: 40px; 
            line-height: 1 !important;
        }
        nav a { 
            text-decoration: none; 
            color: #dcd0c0; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-size: 0.95rem; 
            transition: 0.3s; 
            display: inline-block;
            line-height: 1 !important;
        }
        nav a:hover, nav a.active { color: white; }
        
        /* Basis styling voor de tekst/content eronder */
        .main-content { max-width: 1100px; margin: 0 auto; padding: 0 2rem 5rem; text-align: left; line-height: 1.8; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--blauw); border-bottom: 3px solid var(--blauw); display: inline-block; padding-bottom: 5px; margin-top: 0.5rem; margin-bottom: 2rem; }
        
        /* MOBIELE FIX: Strakke header en groot logo op telefoon */
        @media (max-width: 600px) { 
            nav ul { justify-content: flex-start; padding: 0 25px; gap: 30px; } 
            
            /* Compacte bovenkant op mobiel */
            header { padding: 1rem 1rem 0.2rem; }
            
            /* Logo blijft mooi groot op mobiel */
            header img { 
                max-height: 120px; 
                max-width: 95%; 
            } 
            
            .lang-switch { top: 0.9rem; right: 1rem; gap: 10px; }
            .lang-switch a { font-size: 1.1rem; }
        }
        
        footer { text-align: center; padding: 4rem 1rem; background-color: var(--donker); color: #888; font-size: 0.85rem; }
        footer a { color: #888; text-decoration: none; }
    </style>
</head>
<body>

<header>
    <img src="/foto/Adobe Express - file.png" alt="Koopmans Fine Art" id="header-logo">
    <div class="lang-switch">
        <!-- Zorg dat de NL vlag naar de juiste Nederlandse pagina wijst -->
        <a href="/verzameling/">🇳🇱</a>
        <a href="/en/collection/">🇬🇧</a>
    </div>
</header>

<nav>
    <ul>
        <li><a href="/en/">Home</a></li>
        <!-- De "active" class staat hier nu correct op Collection -->
        <li><a href="/en/collection/" class="active">Collection</a></li>
        <li><a href="/en/auctions/">Auctions</a></li>
        <li><a href="/en/history/">History</a></li>
    </ul>
</nav>

<!-- Hieronder laat je jouw eigen 'main-content' code en footer van de Collection pagina staan -->

<div class="main-content">
    <h2>The Collection</h2>
    <div class="gallery">
        <div class="gallery-item"><a href="/en/items/johanneshelder/"><img src="/foto/helder2.jpeg"></a><p class="item-info">Johannes Helder</p></div>
        <div class="gallery-item"><a href="/en/items/hectorthys/"><img src="/foto/thys1.jpeg"></a><p class="item-info">Hector Thys</p></div>
        <div class="gallery-item"><a href="/en/items/hendrikhulk/"><img src="/foto/HendrikHulk.jpg"></a><p class="item-info">Hendrik Hulk</p></div>
        <div class="gallery-item"><a href="/en/items/arnoudwydeveld/"><img src="/foto/wydeveldnieuw.png"></a><p class="item-info">Arnoud Wydeveld</p></div>
        <div class="gallery-item"><a href="/en/items/hermanusvantankeren/"><img src="/foto/hermanusvantankeren.jpg"></a><p class="item-info">H. van Tankeren</p></div>
        <div class="gallery-item"><a href="/en/items/hageman/"><img src="/foto/Hageman.jpg"></a><p class="item-info">Gerard Hageman</p></div>
        <div class="gallery-item"><a href="/en/items/waltervaes/"><img src="/foto/waltervaes.jpg"></a><p class="item-info">Walter Vaes</p></div>
    </div>
</div>

<footer>
    &copy; 2026 Koopmans Fine Art | M. Koopmans | 
    <a href="/en/disclaimer/">Disclaimer</a>
</footer>

</body>
</html>
