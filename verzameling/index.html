<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verzameling - Koopmans Fine Art</title>
    <link rel="icon" type="image/png" href="/Koopmansfine.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --goud: #b08d57; --blauw: #1f2a35; --donker: #242424; --creme: #f4f1ea; }
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: var(--creme); color: var(--donker); text-align: center; border-top: 10px solid var(--blauw); }
        
        /* 1. DUNNE HEADER (Exact overgenomen van de strakke homepagina) */
        header { padding: 0.5rem 1rem 0.2rem; position: relative; }
        
        /* 2. GROOT LOGO (Exact overgenomen van de homepagina) */
        header img { 
            max-height: 160px; 
            max-width: 95%; 
            display: block; 
            margin: 0 auto; 
            object-fit: contain; 
            will-change: opacity; 
            transition: opacity 0.05s linear; 
        }
        
        /* DUAL TAALSWITCHER RECHTSBOVEN STYLING */
        .lang-switch {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 12px;
        }
        .lang-switch a {
            text-decoration: none;
            font-size: 1.3rem;
            transition: 0.2s;
            display: inline-block;
            line-height: 1;
        }
        .lang-switch a:hover { 
            transform: scale(1.15);
        }
        
        /* 3. MENUBALK (Exact overgenomen van de homepagina) */
        nav { 
            padding: 0.9rem 0; 
            margin-bottom: 2.5rem; 
            background-color: var(--blauw); 
            overflow-x: auto; 
            white-space: nowrap;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
            -webkit-overflow-scrolling: touch; 
            line-height: 1 !important;
        }
        nav::-webkit-scrollbar { display: none; }
        nav ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            gap: 40px; 
            line-height: 1 !important;
        }
        nav a { 
            text-decoration: none; 
            color: #dcd0c0; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-size: 0.95rem; 
            transition: 0.3s; 
            display: inline-block;
            line-height: 1 !important;
        }
        nav a:hover, nav a.active { color: white; }
        
        .main-content { max-width: 1100px; margin: 0 auto; padding: 0 2rem 5rem; text-align: left; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--blauw); border-bottom: 3px solid var(--blauw); display: inline-block; padding-bottom: 5px; margin-bottom: 2rem; }
        
        /* ===================================================================== */
        /* ORIGINELE GALERIJ STYLING (Hierdoor blijven schilderijen mooi in kader) */
        /* ===================================================================== */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; margin-top: 2rem; }
        .gallery-item { background-color: #fff; padding: 15px; border: 12px solid var(--blauw); outline: 1px solid var(--goud); outline-offset: -8px; box-shadow: 15px 15px 35px rgba(0,0,0,0.3); text-align: center; transition: 0.3s; }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img { width: 100%; display: block; }
        .item-info { font-weight: 700; font-size: 0.9rem; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
        /* ===================================================================== */
        /* ===================================================================== */
/* VERKOCHT-LINT */
/* ===================================================================== */
.image-wrapper {
    position: relative;
    width: 100%;
}

.sold-ribbon {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: var(--blauw);
    color: #dcd0c0;
    padding: 10px 8px 9px;
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-align: center;
    box-sizing: border-box;
    border-top: 1px solid var(--goud);
}
        /* MOBIELE FIX: Strakke header en groot logo op telefoon */
        @media (max-width: 600px) { 
            nav ul { 
                justify-content: flex-start; 
                padding: 0 25px; 
                gap: 30px; 
            } 
            header { padding: 1rem 1rem 0.2rem; }
            header img { max-height: 120px; max-width: 95%; } 
            .lang-switch { top: 0.9rem; right: 1rem; gap: 10px; }
            .lang-switch a { font-size: 1.1rem; }
        }
        
        footer { text-align: center; padding: 4rem 1rem; background-color: var(--donker); color: #888; font-size: 0.85rem; }
        footer a { color: #888; text-decoration: none; }
    </style>
</head>
<body>

<header>
   <img src="/foto/Adobe Express - file.png" alt="koopmansfineart.com" id="header-logo">
    <div class="lang-switch">
        <a href="/verzameling/">🇳🇱</a>
        <a href="/en/collection/">🇬🇧</a>
    </div>
</header>

<nav>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/verzameling/" class="active">Verzameling</a></li>
        <li><a href="/veilingen/">Veilingen</a></li>
        <li><a href="/historie/">Historie</a></li>
    </ul>
</nav>

<div class="gallery">

    <div class="gallery-item">
        <a href="/items/johanneshelder/">
            <img src="/foto/helder2.jpeg" alt="Johannes Helder">
        </a>
        <p class="item-info">Johannes Helder</p>
    </div>

    <div class="gallery-item">
        <a href="/items/hectorthys/">
            <div class="image-wrapper">
                <img src="/foto/thys1.jpeg" alt="Hector Thys">
                <div class="sold-ribbon">Verkocht</div>
            </div>
        </a>
        <p class="item-info">Hector Thys</p>
    </div>

    <div class="gallery-item">
        <a href="/items/hendrikhulk/">
            <div class="image-wrapper">
                <img src="/foto/HendrikHulk.jpg" alt="Hendrik Hulk">
                <div class="sold-ribbon">Verkocht</div>
            </div>
        </a>
        <p class="item-info">Hendrik Hulk</p>
    </div>

    <div class="gallery-item">
        <a href="/items/arnoudwydeveld/">
            <img src="/foto/arnoud.png" alt="Arnoud Wydeveld">
        </a>
        <p class="item-info">Arnoud Wydeveld</p>
    </div>

    <div class="gallery-item">
        <a href="/items/hermanusvantankeren/">
            <div class="image-wrapper">
                <img src="/foto/hermanusvantankeren.jpg" alt="H. van Tankeren">
                <div class="sold-ribbon">Verkocht</div>
            </div>
        </a>
        <p class="item-info">H. van Tankeren</p>
    </div>

    <div class="gallery-item">
        <a href="/items/hageman/">
            <div class="image-wrapper">
                <img src="/foto/Hageman.jpg" alt="Hageman">
                <div class="sold-ribbon">Verkocht</div>
            </div>
        </a>
        <p class="item-info">Hageman</p>
    </div>

    <div class="gallery-item">
        <a href="/items/waltervaes/">
            <div class="image-wrapper">
                <img src="/foto/waltervaes.jpg" alt="Walter Vaes">
                <div class="sold-ribbon">Verkocht</div>
            </div>
        </a>
        <p class="item-info">Walter Vaes</p>
    </div>

</div>

<footer>
    &copy; 2026 Koopmans Fine Art | M. Koopmans | 
    <a href="/disclaimer/">Disclaimer</a>
</footer>

<script>
    // Logo fade effect tijdens scrollen
    window.addEventListener('scroll', function() {
        var logo = document.getElementById('header-logo');
        var scrollPosition = window.scrollY;
        var maxScroll = 180; 
        var opacity = 1 - (scrollPosition / maxScroll);
        if (opacity < 0) opacity = 0;
        if (opacity > 1) opacity = 1;
        if (logo) logo.style.opacity = opacity;
    });

    // Zorgt ervoor dat de actieve knop op mobiel netjes in het viewport schuift
    document.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
            var activeLink = document.querySelector('nav a.active');
            var nav = document.querySelector('nav');
            if (activeLink && nav) {
                var navRect = nav.getBoundingClientRect();
                var linkRect = activeLink.getBoundingClientRect();
                nav.scrollLeft = nav.scrollLeft + (linkRect.left - navRect.left) - (navRect.width / 2) + (linkRect.width / 2);
            }
        }, 50);
    });
</script>

</body>
</html>
