<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verzameling - Koopmans Fine Art</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --goud: #b08d57; --hout: #3d2b1f; --donker: #242424; --creme: #f4f1ea; }
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: var(--creme); color: var(--donker); text-align: center; border-top: 10px solid var(--hout); line-height: 1.7; }
        header { padding: 3.5rem 1rem 2rem; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; text-transform: uppercase; margin: 0; }
        nav { padding: 0.9rem 0; margin-bottom: 2.5rem; background-color: var(--hout); }
        nav ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; gap: 40px; }
        nav a { text-decoration: none; color: #dcd0c0; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; }
        nav a:hover, nav a.active { color: white; }
        .main-content { max-width: 1100px; margin: 0 auto; padding: 0 2rem 5rem; text-align: left; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--hout); border-bottom: 3px solid var(--hout); display: inline-block; padding-bottom: 5px; margin-bottom: 2rem; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 50px; }
        .gallery-item { background-color: #fff; padding: 20px; border: 15px solid var(--hout); outline: 1px solid var(--goud); outline-offset: -8px; box-shadow: 15px 15px 35px rgba(0,0,0,0.3); text-align: center; transition: 0.3s; }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img { width: 100%; height: auto; display: block; }
        .item-info { font-weight: 700; font-size: 0.9rem; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        footer { text-align: center; padding: 4rem 1rem; background-color: var(--donker); color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
<header><h1>MK Fine Art</h1></header>
<nav>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/verzameling/" class="active">Verzameling</a></li>
        <li><a href="/historie/">Historie</a></li>
    </ul>
</nav>
<div class="main-content">
    <h2>De Verzameling</h2>
    <div class="gallery">
        <div class="gallery-item"><a href="../items/hageman/"><img src="../foto/Hageman.jpg"></a><p class="item-info">Hageman</p></div>
        <div class="gallery-item"><a href="../items/epcarim/"><img src="../foto/Epcarim.jpg"></a><p class="item-info">EFCARIM</p></div>
        <div class="gallery-item"><a href="../items/waltervaes/"><img src="../foto/waltervaes.jpg"></a><p class="item-info">Walter Vaes</p></div>
        <div class="gallery-item"><a href="../items/hendrikhulk/"><img src="../foto/HendrikHulk.jpg"></a><p class="item-info">Hendrik Hulk</p></div>
        <div class="gallery-item"><a href="../items/vavezelay/"><img src="../foto/va.jpg"></a><p class="item-info">Basilique Vezelay</p></div>
        <div class="gallery-item"><a href="../items/joopkoopman/"><img src="../foto/joopkoopman.jpg"></a><p class="item-info">J.M. Koopman</p></div>
          </div>
</div>
<footer>&copy; 2026 Koopmans Fine Art | M. Koopmans</footer>
</body>
</html>
