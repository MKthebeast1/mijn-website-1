<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koopmans Fine Art</title>
    <link rel="icon" type="image/png" href="11.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --goud: #b08d57; --blauw: #1f2a35; --donker: #242424; --creme: #f4f1ea; --papier: #e9e4d9; }
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: var(--creme); color: var(--donker); text-align: center; border-top: 10px solid var(--blauw); }
        header { padding: 2rem 1rem 1rem; }
        header img { max-height: 120px; max-width: 90%; display: block; margin: 0 auto; object-fit: contain; }
        nav { padding: 0.9rem 0; margin-bottom: 2.5rem; background-color: var(--blauw); }
        nav ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        nav a { text-decoration: none; color: #dcd0c0; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; transition: 0.3s; }
        nav a:hover, nav a.active { color: white; }
        .main-content { max-width: 1100px; margin: 0 auto; padding: 0 2rem 5rem; text-align: left; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--blauw); border-bottom: 3px solid var(--blauw); display: inline-block; padding-bottom: 5px; margin-bottom: 2rem; }
        .ticker-wrap { width: 100%; overflow: hidden; background-color: var(--papier); padding: 30px 0; margin: 3rem 0; border-top: 2px solid var(--blauw); border-bottom: 2px solid var(--blauw); }
        .ticker { display: flex; width: fit-content; animation: ticker-scroll 40s linear infinite; }
        .ticker-item { flex-shrink: 0; margin: 0 20px; height: 200px; border: 8px solid var(--blauw); outline: 1px solid var(--goud); outline-offset: -5px; box-shadow: 10px 10px 20px rgba(0,0,0,0.2); background-color: white; }
        .ticker-item img { height: 100%; display: block; }
        @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @media (max-width: 600px) { 
    nav ul { gap: 15px; padding: 0 10px; } 
    header { padding: 1.5rem 1rem 1rem; }
    header img { max-height: 65px; max-width: 85%; } 
}
        }
        footer { text-align: center; padding: 4rem 1rem; background-color: var(--donker); color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
<header><img src="11.png" alt="Koopmans Fine Art"></header>
<nav>
    <ul>
        <li><a href="/" class="active">Home</a></li>
        <li><a href="/verzameling/">Verzameling</a></li>
        <li><a href="/historie/">Historie</a></li>
    </ul>
</nav>
<div class="main-content">
    <h2>Welkom</h2>
    <p>Welkom op de website van Koopmans Fine Art. Wij richten ons op de conservatie en verkoop van authentieke kunstwerken en historische objecten met een eigen karakter.</p>
    <div class="ticker-wrap">
        <div class="ticker">
            <div class="ticker-item"><img src="foto/Hageman.jpg"></div>
            <div class="ticker-item"><img src="foto/Epcarim.jpg"></div>
            <div class="ticker-item"><img src="foto/waltervaes.jpg"></div>
            <div class="ticker-item"><img src="foto/HendrikHulk.jpg"></div>
            <div class="ticker-item"><img src="foto/va.jpg"></div>
            <div class="ticker-item"><img src="foto/joopkoopman.jpg"></div>
            <div class="ticker-item"><img src="foto/Hageman.jpg"></div>
            <div class="ticker-item"><img src="foto/Epcarim.jpg"></div>
        </div>
    </div>
</div>
<footer>&copy; 2026 Koopmans Fine Art | M. Koopmans</footer>
</body>
</html>
