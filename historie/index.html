<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historie - Koopmans Fine Art</title>
    <link rel="icon" type="image/png" href="../1.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --goud: #b08d57; --blauw: #1f2a35; --donker: #242424; --creme: #f4f1ea; }
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: var(--creme); color: var(--donker); text-align: center; border-top: 10px solid var(--blauw); line-height: 1.8; }
        header { padding: 2rem 1rem 1rem; }
        header img { max-height: 120px; display: block; margin: 0 auto; width: auto; }
        nav { padding: 0.9rem 0; margin-bottom: 2.5rem; background-color: var(--blauw); }
        nav ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        nav a { text-decoration: none; color: #dcd0c0; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; }
        nav a:hover, nav a.active { color: white; }
        .main-content { max-width: 900px; margin: 0 auto; padding: 0 2rem 5rem; text-align: left; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--blauw); border-bottom: 3px solid var(--blauw); display: inline-block; padding-bottom: 5px; margin-bottom: 2rem; }
        @media (max-width: 600px) { 
            nav ul { gap: 15px; padding: 0 10px; } 
            header img { max-height: 80px; } 
        }
        footer { text-align: center; padding: 4rem 1rem; background-color: var(--donker); color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
<header><img src="../1.jpg" alt="Koopmans Fine Art"></header>
<nav>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/verzameling/">Verzameling</a></li>
        <li><a href="/historie/" class="active">Historie</a></li>
    </ul>
</nav>
<div class="main-content">
    <h2>Historie & Visie</h2>
    <p>Koopmans Fine Art is ontstaan vanuit een fascinatie voor de verhalen achter historische objecten. Het vormt een brug tussen het verleden en het heden.</p>
</div>
<footer>&copy; 2026 Koopmans Fine Art | M. Koopmans</footer>
